services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: crypto_intelligence
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://crypto:crypto@postgres:5432/crypto_intelligence
      - REDIS_URL=redis://redis:6379/0
      - DEMO_MODE=true
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: [./apps/api:/app]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: celery -A app.workers.celery_app worker -l info -c 2
    environment:
      - DATABASE_URL=postgresql+asyncpg://crypto:crypto@postgres:5432/crypto_intelligence
      - REDIS_URL=redis://redis:6379/0
      - DEMO_MODE=true
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  scheduler:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: celery -A app.workers.celery_app beat -l info
    environment:
      - DATABASE_URL=postgresql+asyncpg://crypto:crypto@postgres:5432/crypto_intelligence
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on: [api]

volumes:
  pgdata:
